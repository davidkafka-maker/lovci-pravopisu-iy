const TIME_LIMIT=10, TEST_COUNT=30, CHALLENGE_TARGET=30;
let state={screen:'home',mode:null,name:'',clazz:'',pool:[],current:null,index:0,score:0,wrong:0,streak:0,timeLeft:0,timer:null,locked:false,cheated:false,finishSent:false};
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(h,mode=state.mode){document.body.className=mode?'mode-'+mode:'';app.innerHTML=h;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions[b.dataset.act]())}
function home(){clearTimer();state={...state,screen:'home',mode:null,score:0,wrong:0,streak:0,cheated:false,finishSent:false};render(`<div class="card"><h1 class="title">Lovci pravopisu i/y</h1><p class="subtitle">Vyber režim a ulov správné i/y.</p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button></div><div class="row"><a class="btn ghost" href="${RESULTS_SHEET_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div><p class="small">VÝZVA: TEST: 16 náhodných úloh. Čas: 10 s na úlohu.<br>Databáze v této verzi: ${QUESTIONS.length} úloh.</p></div>`,null)}
function nameScreen(mode){state.mode=mode;render(`<div class="card"><h1 class="title">${mode==='challenge'?'VÝZVA':'TEST'}</h1><div class="nameBox"><input class="input" id="name" placeholder="Jméno žáka"><input class="input" id="clazz" placeholder="Třída"><button class="btn ${mode==='challenge'?'challengeBtn':'testBtn'}" id="start">ZAČÍT</button><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div></div>`,mode);document.getElementById('start').onclick=()=>{state.name=document.getElementById('name').value.trim();state.clazz=document.getElementById('clazz').value.trim();if(!state.name||!state.clazz){alert('Vyplň jméno i třídu.');return}start(mode)}}
function start(mode){state={...state,screen:'question',mode,score:0,wrong:0,streak:0,index:0,locked:false,cheated:false,finishSent:false,pool:shuffle(QUESTIONS)};if(mode==='test')state.pool=state.pool.slice(0,Math.min(TEST_COUNT,state.pool.length));next()}
function next(){clearTimer();state.locked=false;if(state.mode==='challenge'){if(!state.pool.length)state.pool=shuffle(QUESTIONS);state.current=state.pool.pop()}else{if(state.index>=state.pool.length)return finishTest();state.current=state.pool[state.index]}renderQuestion();startTimer()}
function renderQuestion(){let m=state.mode, q=state.current;let status=m==='challenge'?`SÉRIE ${state.streak}/${CHALLENGE_TARGET}`:`OTÁZKA ${state.index+1}/${state.pool.length} • BODY ${state.score}`;render(`<div class="card"><div class="topbar"><div class="seal ${m==='challenge'?'challengeSeal':'testSeal'}">${m==='challenge'?'VÝZVA':'TEST'}</div><div class="timeCenter"><span id="time">${TIME_LIMIT}</span><span class="status">${status}</span></div><div class="seal sectionSeal">${esc(q.category)}</div></div><div class="prompt">Doplň správné písmeno.</div><div class="question">${esc(q.sentence)}</div><div class="answers">${(()=>{const long=q.answers.some(a=>a==='í'||a==='ý');const opts=long?['í','ý']:['i','y'];if(q.answers.includes('a'))opts.push('a');return opts.map(a=>`<button class="ans" data-a="${a}">${a.toUpperCase()}</button>`).join('')})()}</div><div class="feedback" id="fb"></div><div class="row"><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div></div>`,m);document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(b.dataset.a,b))}
function answer(a,btn){if(state.locked)return;state.locked=true;clearTimer();let good=state.current.answers.includes(a),fb=document.getElementById('fb');document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(state.current.answers.includes(b.dataset.a))b.classList.add('correct')});if(good){btn.classList.add('correct');state.score++;state.streak++;fb.innerHTML='<span class="ok">SPRÁVNĚ!</span>';soundCorrect();if(state.mode==='challenge'&&state.streak>=CHALLENGE_TARGET)return setTimeout(finishChallenge,650)}else{btn.classList.add('wrong');state.wrong++;state.streak=0;fb.innerHTML=`<span class="bad">CHYBA</span><br><span class="small">Správně: ${state.current.answers.join(' / ')}</span>`;soundWrong();}if(state.mode==='test')state.index++;setTimeout(next,good?650:1150)}
function timeout(){if(state.locked)return;state.locked=true;state.wrong++;state.streak=0;document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(state.current.answers.includes(b.dataset.a))b.classList.add('correct')});document.getElementById('fb').innerHTML=`<span class="bad">ČAS VYPRŠEL</span><br><span class="small">Správně: ${state.current.answers.join(' / ')}</span>`;soundWrong();if(state.mode==='test')state.index++;setTimeout(next,1150)}
function startTimer(){state.timeLeft=TIME_LIMIT;updateTime();state.timer=setInterval(()=>{state.timeLeft--;updateTime();if(state.timeLeft<=0){clearTimer();timeout()}},1000)}
function updateTime(){let e=document.getElementById('time');if(e)e.textContent=state.timeLeft}function clearTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function grade(s,t){if(s>=29)return 1;if(s>=27)return 2;if(s>=25)return 3;if(s>=23)return 4;return 5}
function finishTest(){clearTimer();state.screen='finish';let total=state.pool.length,z=state.cheated?6:grade(state.score,total);sendResult(z,total,'TEST');render(`<div class="card"><h1 class="title">VÝSLEDEK</h1><div class="result"><b>${esc(state.name)}</b> • ${esc(state.clazz)}<br><b>Body:</b> ${state.score}/${total}<br><b>Známka:</b> ${z}</div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`,'test')}
function finishChallenge(){clearTimer();state.screen='finish';sendResult(1,state.score+state.wrong,'VÝZVA');render(`<div class="card"><div class="result"><b>Dokázal jsi odpovědět 30x za sebou správně a tak máš jedničku!</b></div></div>`,'challenge')}
function buildPayload(z,total,kind){return{timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:kind.toLowerCase(),oddil:'pravopis i/y',body:state.score,celkem:total,spravne:state.score,spatne:state.wrong,poznamka:state.cheated?'PODVOD':kind,sheetId:SHEET_ID,app:'Lovci pravopisu i/y'}}
function sendResult(z,total,kind,urgent=false){if(state.finishSent&&!urgent)return;state.finishSent=true;let p=buildPayload(z,total,kind),params=new URLSearchParams();Object.entries(p).forEach(([k,v])=>params.append(k,String(v??'')));try{if(urgent&&navigator.sendBeacon){navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([params.toString()],{type:'application/x-www-form-urlencoded'}))}else fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),keepalive:true})}catch(e){}}
function activeProtected(){return ['test','challenge'].includes(state.mode)&&state.screen==='question'}
function cheatFinish(reason){soundCheat();if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen='finish';clearTimer();sendResult(6,state.mode==='test'?state.pool.length:state.score+state.wrong,'PODVOD: '+reason,true);render(`<div class="card cheat"><h1 class="title">PODVOD</h1><div class="result">Pokus byl ukončen kvůli opuštění testovacího okna.<br><b>Známka: 6</b></div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`,state.mode)}
let ac=null;let audioCtx=null;
function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function tone(freq,dur,gain=.08,type='sine',delay=0){try{unlockAudio();if(!audioCtx)return;let t=audioCtx.currentTime+delay;let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.03);}catch(e){}}
function soundCorrect(){tone(720,.08,.06,'sine');tone(980,.10,.05,'sine',.07)}
function soundWrong(){tone(150,.20,.22,'square');tone(110,.23,.20,'sawtooth',.17);tone(80,.22,.18,'square',.34)}
function soundCheat(){tone(95,.65,.28,'sawtooth');tone(70,.65,.24,'square',.35);tone(95,.65,.28,'sawtooth',.72)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cheatFinish('přepnutí mimo stránku')});window.addEventListener('pagehide',()=>cheatFinish('opuštění stránky'));window.addEventListener('beforeunload',e=>{if(activeProtected()){e.preventDefault();e.returnValue='';}});window.addEventListener('blur',()=>setTimeout(()=>{if(activeProtected()&&document.visibilityState==='visible'&&!document.hasFocus())cheatFinish('ztráta aktivního okna')},650));
const actions={home,nameChallenge:()=>nameScreen('challenge'),nameTest:()=>nameScreen('test')};home();
</script></body></html>
